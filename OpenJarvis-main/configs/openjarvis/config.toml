# OpenJarvis configuration — Render deployment (Gemini cloud engine)

[intelligence]
default_model = "gemini-2.5-flash"
fallback_model = ""
preferred_engine = "cloud"
provider = "google"
quantization = "none"
temperature = 0.7
max_tokens = 1024
top_p = 0.9
top_k = 40
repetition_penalty = 1.0

[agent]
default_agent = "simple"
max_turns = 10
tools = "web_search,calculator,think"
objective = "Answer questions accurately using available tools"
context_from_memory = false

[tools.storage]
default_backend = "sqlite"
db_path = "~/.openjarvis/memory.db"

[tools.mcp]
enabled = true

[engine]
default = "cloud"

[learning]
enabled = false

[learning.routing]
policy = "heuristic"

[learning.intelligence]
policy = "none"

[learning.agent]
policy = "none"

[learning.metrics]
accuracy_weight = 0.6
latency_weight = 0.2
cost_weight = 0.1
efficiency_weight = 0.1

[telemetry]
enabled = false
db_path = "~/.openjarvis/telemetry.db"

[traces]
enabled = true
db_path = "~/.openjarvis/traces.db"

[server]
host = "0.0.0.0"
port = 8000
agent = "simple"
