# OpenJarvis configuration — Render deployment (Gemini cloud engine)

# ═══════════════════════════════════════════════════════════════
# PILLAR 1: Intelligence — The Model
# ═══════════════════════════════════════════════════════════════
[intelligence]
default_model = "gemini-2.5-flash"        # Google Gemini free-tier model
fallback_model = ""
preferred_engine = "cloud"                # Use cloud API, not local GPU
provider = "google"
quantization = "none"
temperature = 0.7
max_tokens = 1024
top_p = 0.9
top_k = 40
repetition_penalty = 1.0

# ═══════════════════════════════════════════════════════════════
# PILLAR 2: Agent — The Agentic Harness
# ═══════════════════════════════════════════════════════════════
[agent]
default_agent = "simple"                  # Lightweight, no heavy tool loop
max_turns = 10
tools = "web_search,calculator,think"
objective = "Answer questions accurately using available tools"
context_from_memory = false

# ═══════════════════════════════════════════════════════════════
# PILLAR 3: Tools — MCP Interface
# ═══════════════════════════════════════════════════════════════
[tools.storage]
default_backend = "sqlite"
db_path = "~/.openjarvis/memory.db"

[tools.mcp]
enabled = true

# ═══════════════════════════════════════════════════════════════
# PILLAR 4: Engine — The Inference Runtime
# ═══════════════════════════════════════════════════════════════
[engine]
default = "cloud"                         # Changed from "vllm"

# ═══════════════════════════════════════════════════════════════
# PILLAR 5: Learning — Improvement Methodologies
# ═══════════════════════════════════════════════════════════════
[learning]
enabled = false

[learning.routing]
policy = "heuristic"

[learning.intelligence]
policy = "none"

[learning.agent]
policy = "none"

[learning.metrics]
accuracy_weight = 0.6
latency_weight = 0.2
cost_weight = 0.1
efficiency_weight = 0.1

# ═══════════════════════════════════════════════════════════════
# Supporting config
# ═══════════════════════════════════════════════════════════════
[telemetry]
enabled = false                           # No GPU on Render, disable
db_path = "~/.openjarvis/telemetry.db"

[traces]
enabled = true
db_path = "~/.openjarvis/traces.db"

[server]
host = "0.0.0.0"
port = 8000
agent = "simple"
